name: Sincronizar ligas y partidos 365Scores

on:
  schedule:
    - cron: '30 11 * * *' # 6:30 AM hora Bogota (UTC-5)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar endpoint de sincronizacion
        env:
          SYNC365_URL: ${{ secrets.SYNC365_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --max-time 120 \
            -X POST "${SYNC365_URL}/api/sync" \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Sincronizacion exitosa: $BODY"
            exit 0
          fi

          echo "Primer intento fallo con codigo $HTTP_CODE: $BODY"
          echo "Reintentando en 10 segundos..."
          sleep 10

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --max-time 120 \
            -X POST "${SYNC365_URL}/api/sync" \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Sincronizacion exitosa (reintento): $BODY"
            exit 0
          fi

          echo "Segundo intento fallo con codigo $HTTP_CODE: $BODY"
          exit 1
